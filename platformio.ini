; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lineS3lora

[env:lorawan]
platform = espressif32
board = seeed_xiao_esp32s3
; ARDUINONVS_SILENT: the LoRaWAN session is written to NVS after every uplink and
; ArduinoNvs prints a line per blob write, which would drown the console
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_LORAWAN -D FLASH_SIZE_MB=8 -D ARDUINONVS_SILENT=1
build_src_flags = -D LED_ON_BOARD=21

; The private mesh: AES-128-CCM frames, one group key, flooding with a hop
; countdown. See src/lora/loraFrame.h for the wire format. Any board can join by
; defining THR_LORA_MESH and calling taskLoraMesh().
[env:loraMesh]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_LORA_MESH -D FLASH_SIZE_MB=8 -D ARDUINONVS_SILENT=1
build_src_flags = -D LED_ON_BOARD=21

; The same mesh firmware with a GPS receiver: taskGPS writes the fix, the
; satellite count, the HDOP and the fix quality into G to N, and the generic
; periodic broadcast (DF, DG, DH) puts them on the air
[env:loraGPS]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_LORA_MESH -D FLASH_SIZE_MB=8 -D ARDUINONVS_SILENT=1 -D GPS_RX=D7 -D GPS_BAUD=115200
build_src_flags = -D LED_ON_BOARD=21

[env:lineC3]
platform = espressif32
board = seeed_xiao_esp32c3
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_PIXELS -D FLASH_SIZE_MB=4
; MQTT is required for Christmas decorations
build_src_flags = -D PIXELS_PIN=8 -D FETCH_WEATHER=1 -D TASK_MQTT=1

[env:lineS3]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_PIXELS
build_src_flags = -D PIXELS_PIN=7 -D LED_ON_BOARD=21 -D FETCH_WEATHER=1 -D TASK_MQTT=1 -D TASK_WIFIAP=1 -D FLASH_SIZE_MB=8

; A pixels board that is also a mesh node: the same firmware as lineS3 plus the
; Wio-SX1262 on the expansion connector. TASK_LORA_MESH has to be in build_flags
; rather than build_src_flags because lib/hack allocates parameters[MAX_PARAM]
; and prints the (a) menu - the library has to see the mesh block too.
;
; The strip moves to D0 (GPIO1): the radio hangs off the default SPI bus, whose
; SCK is GPIO7 - which is exactly the D8 lineS3 drives its pixels from.
[env:lineS3lora]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_PIXELS -D TASK_LORA_MESH=1
build_src_flags = -D PIXELS_PIN=1 -D LED_ON_BOARD=21 -D FLASH_SIZE_MB=8

[env:9_outputs]
platform = espressif32
board = seeed_xiao_esp32c3
build_flags = -I include -I src -I src/pixels -D BOARD_TYPE=KIND_9_OUTPUTS -D FLASH_SIZE_MB=4
build_src_flags = 

; The energy wall: a 16x16 panel showing solar production, battery level,
; consumption and the grid, fed by https://solar.patiny.com/api/energy-flow/compact
; (see src/fronius.cpp). It hangs on the wall, so it is flashed over the air —
; ArduinoOTA, no password. An IP upload_port selects espota automatically; pass
; --upload-port /dev/cu.xxx to fall back to USB.
[env:square]
platform = espressif32
board = seeed_xiao_esp32s3
upload_port = 192.168.1.200
build_flags = -I include -I src -D BOARD_TYPE=KIND_PIXELS
build_src_flags = -D PIXELS_PIN=7 -D LED_ON_BOARD=21 -D FETCH_FRONIUS=1 -D FETCH_WEATHER=1 -D FLASH_SIZE_MB=8

[env:lolin32]
platform = espressif32
board = lolin32
monitor_speed = 115200
upload_speed = 921600
build_src_flags = -D PIXELS_PIN=12 -D LED_ON_BOARD=5 -D FLASH_SIZE_MB=4

[env:lolin_c3_mini]
platform = espressif32@6.5.0
platform_packages = 
	espressif/toolchain-riscv32-esp
board = lolin_c3_mini
build_src_flags = -D PIXELS_PIN=8 -D FLASH_SIZE_MB=4

[env]
framework = arduino
lib_deps = 
	bitbank2/AnimatedGIF@^1.4.7
  adafruit/Adafruit AHTX0@^2.0.5
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit NeoPixel@^1.15.1
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit Si7021 Library @ ^1.5.3
	Makuna/NeoPixelBus@^2.7.8
	bblanchon/ArduinoJson@^6.0.0
	ottowinter/AsyncMqttClient-esphome@^0.8.6
	esphome/ESPAsyncWebServer-esphome@^3.4.0
	h2zero/NimBLE-Arduino@^1.3.8
	PaulStoffregen/OneWire@^2.3.7
	dlloydev/ESP32 ESP32S2 AnalogWrite@^4.3.4
	https://github.com/FastLED/FastLED.git#3.9.2
	rpolitex/ArduinoNvs@2.8.0
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.2.0
	jgromes/RadioLib@7.4.0
	mikalhart/TinyGPSPlus@^1.1.0
monitor_echo = true
